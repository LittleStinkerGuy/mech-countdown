<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Controls Time Counter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1 class="title">brat but its how late the robot is</h1>
      <div class="counter" aria-live="polite">
        <p id="days" class="line">0 DAYS</p>
        <p id="hours" class="line">0 HOURS</p>
        <p id="minutes" class="line">0 MINUTES</p>
        <p id="seconds" class="line">0 SECONDS</p>
      </div>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
